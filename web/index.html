<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/icone-notas.png">
  <link rel="apple-touch-icon" href="/icone-notas.png">
  <title>Notas</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>

  <main id="aplicativo" class="aplicativo">
    <section id="telaPastas" class="tela tela--ativa" aria-labelledby="tituloPastas">
      <header class="topo-app">
        <div>
          <p class="topo-app__contexto" id="saudacao"></p>
          <h1 id="tituloPastas">Pastas</h1>
          <p class="topo-app__estado" id="estado"></p>
        </div>
        <button type="button" id="sair" class="controle-circular" aria-label="Sair">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5H5v14h4M14 8l4 4-4 4M18 12H9"/></svg>
        </button>
      </header>

      <div class="secao-notas">
        <div class="secao-notas__cabecalho">
          <h2>Minhas pastas</h2>
          <span id="totalPastas" class="contador"></span>
        </div>
        <ul id="pastas" class="cartao-lista lista-pastas"></ul>
      </div>

      <div class="barra-inferior">
        <label class="busca-flutuante">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
          <input type="search" id="buscaPastas" placeholder="Buscar pastas">
        </label>
        <button type="button" id="novaNotaPasta" class="controle-circular controle-circular--destaque" aria-label="Nova nota">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7"/><path d="m14 4 6 6M12 12l8-8"/></svg>
        </button>
      </div>
    </section>

    <section id="telaNotas" class="tela" hidden aria-labelledby="tituloPasta">
      <header class="barra-navegacao">
        <button type="button" id="voltarPastas" class="controle-circular" aria-label="Voltar para pastas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" id="maisNotas" class="controle-circular" aria-label="Mais op&ccedil;&otilde;es">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
        </button>
      </header>
      <div class="titulo-lista">
        <p id="caminhoPasta">Pastas</p>
        <h1 id="tituloPasta">Notas</h1>
        <span id="contagemNotas"></span>
      </div>
      <div id="lista" class="lista-notas"></div>

      <div class="barra-inferior">
        <label class="busca-flutuante">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
          <input type="search" id="busca" placeholder="Buscar">
        </label>
        <button type="button" id="novaNota" class="controle-circular controle-circular--destaque" aria-label="Nova nota">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-7"/><path d="m14 4 6 6M12 12l8-8"/></svg>
        </button>
      </div>
    </section>

    <section id="telaEditor" class="tela tela-editor" hidden aria-labelledby="titulo">
      <header class="barra-navegacao barra-navegacao--editor">
        <button type="button" id="voltarEditor" class="controle-circular" aria-label="Voltar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="acoes-editor">
          <button type="button" id="maisEditor" class="controle-circular" aria-label="A&ccedil;&otilde;es da nota">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          </button>
          <button type="button" id="salvar" class="controle-circular controle-circular--concluir" disabled aria-label="Salvar nota">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
          </button>
        </div>
      </header>

      <div id="menuNota" class="menu-nota" hidden>
        <button type="button" data-menu="pdf">Gerar PDF</button>
        <button type="button" data-menu="mapa">Gerar mapa visual</button>
        <button type="button" data-menu="foto">PDF com foto</button>
        <button type="button" data-menu="apagar" class="menu-nota__destrutivo">Apagar nota</button>
      </div>

      <div class="editor-documento">
        <p id="dataEditor" class="data-editor"></p>
        <input type="text" id="titulo" class="campo-titulo" placeholder="T&iacute;tulo">
        <div class="metadados-editor">
          <label for="assunto">Pasta</label>
          <input type="text" id="assunto" list="assuntos" placeholder="Sem assunto">
          <datalist id="assuntos"></datalist>
        </div>
        <textarea id="texto" class="campo-nota" placeholder="Comece a escrever ou anexe uma foto..."></textarea>

        <div id="resultadoAnalise" class="resultado-analise oculto" aria-live="polite">
          <span class="ficha" id="tipoDetectado"></span>
          <p id="incertezas"></p>
        </div>

        <div id="areaImagem" class="painel-foto oculto">
          <div class="palco__moldura"><canvas id="tela"></canvas></div>
          <div class="cartao-lista ajustes-foto">
            <div class="linha linha--controle">
              <span class="linha__titulo">Girar</span>
              <button type="button" id="girar" class="botao botao--discreto">90&deg;</button>
            </div>
            <div class="linha linha--controle">
              <label class="linha__titulo" for="contraste">Contraste</label>
              <input type="range" id="contraste" min="0.5" max="2.5" step="0.05" value="1">
            </div>
            <div class="linha linha--controle">
              <label class="linha__titulo" for="brilho">Brilho</label>
              <input type="range" id="brilho" min="-60" max="60" step="2" value="0">
            </div>
            <div class="linha linha--controle">
              <label class="linha__titulo" for="pretoBranco">Preto e branco</label>
              <input type="checkbox" id="pretoBranco" class="chave">
            </div>
            <div class="linha linha--controle">
              <label class="linha__titulo" for="formatoLeitura">Formato</label>
              <select id="formatoLeitura" class="seletor">
                <option value="automatico">Autom&aacute;tico</option>
                <option value="texto">Texto comum</option>
                <option value="mapa_mental">Mapa mental</option>
              </select>
            </div>
          </div>
          <button type="button" id="ler" class="botao botao--principal" disabled>
            <span class="botao__rotulo">Ler a foto com IA</span>
            <span class="girador" aria-hidden="true"></span>
          </button>
          <p class="nota-rodape" id="statusLeitura"></p>
        </div>
      </div>

      <div class="barra-editor">
        <button type="button" id="mostrarFormato" class="ferramenta-editor" aria-label="Ajuda de formata&ccedil;&atilde;o"><span>Aa</span></button>
        <label for="arquivo" class="ferramenta-editor ferramenta-editor--anexo" aria-label="Anexar ou fotografar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg>
        </label>
        <input type="file" id="arquivo" accept="image/*" capture="environment" class="oculto-visual">
        <span id="statusEditor" class="status-editor">Nota edit&aacute;vel</span>
      </div>
    </section>
  </main>

  <!-- Feedback de conclusao: aparece, informa, some. Nao bloqueia nada. -->
  <div class="brindes" id="brindes" role="status" aria-live="polite"></div>

  <!-- Folha de acao: some pelo mesmo caminho por onde entrou, e da pra
       arrastar pra baixo pra dispensar. -->
  <div class="folha" id="folha" hidden>
    <div class="folha__veu" id="veu"></div>
    <div class="folha__painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo">
      <div class="folha__pegador" aria-hidden="true"></div>
      <h3 class="folha__titulo" id="folhaTitulo">Apagar esta nota?</h3>
      <p class="folha__texto" id="folhaTexto">N&atilde;o d&aacute; pra desfazer.</p>
      <button type="button" class="botao botao--destrutivo" id="folhaConfirmar">Apagar</button>
      <button type="button" class="botao botao--neutro" id="folhaCancelar">Cancelar</button>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
