<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Notas</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body>

  <!-- Camada translucida flutuante: o conteudo rola por baixo dela.
       O efeito de borda (sombra + borrao) so aparece quando ha conteudo
       passando embaixo -- nada de divisoria de 1px sempre visivel. -->
  <header class="chrome" id="chrome">
    <div class="chrome__interior">
      <h1 class="titulo-grande">Notas</h1>
      <p class="etiqueta" id="estado"></p>
    </div>
  </header>

  <main>

    <!-- ETAPA 1 --------------------------------------------------------- -->
    <section class="secao">
      <h2 class="cabecalho-secao">Foto</h2>
      <div class="grupo">

        <label class="linha linha--acao" for="arquivo">
          <span class="linha__icone" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 8.5A2.5 2.5 0 0 1 5.5 6h1.7a1 1 0 0 0 .8-.4l1-1.3a1 1 0 0 1 .8-.4h4.4a1 1 0 0 1 .8.4l1 1.3a1 1 0 0 0 .8.4h1.7A2.5 2.5 0 0 1 21 8.5v9A2.5 2.5 0 0 1 18.5 20h-13A2.5 2.5 0 0 1 3 17.5z"/>
              <circle cx="12" cy="12.5" r="3.6"/>
            </svg>
          </span>
          <span class="linha__texto">
            <span class="linha__titulo">Escolher ou tirar foto</span>
            <span class="linha__detalhe">No celular abre a c&acirc;mera direto</span>
          </span>
          <span class="linha__seta" aria-hidden="true">&rsaquo;</span>
        </label>
        <input type="file" id="arquivo" accept="image/*" capture="environment" class="oculto-visual">

      </div>

      <div id="areaImagem" class="palco oculto">
        <div class="palco__moldura">
          <canvas id="tela"></canvas>
        </div>

        <div class="grupo">
          <div class="linha linha--controle">
            <span class="linha__titulo">Girar</span>
            <button type="button" id="girar" class="botao botao--discreto">90&deg;</button>
          </div>
          <div class="linha linha--controle">
            <label class="linha__titulo" for="contraste">Contraste</label>
            <input type="range" id="contraste" min="0.5" max="2.5" step="0.05" value="1.3">
          </div>
          <div class="linha linha--controle">
            <label class="linha__titulo" for="brilho">Brilho</label>
            <input type="range" id="brilho" min="-60" max="60" step="2" value="0">
          </div>
          <div class="linha linha--controle">
            <label class="linha__titulo" for="pretoBranco">Preto e branco</label>
            <input type="checkbox" id="pretoBranco" class="chave" checked>
          </div>
        </div>
        <p class="nota-rodape">Mais contraste ajuda a IA a acertar a letra.</p>
      </div>
    </section>

    <!-- ETAPA 2 --------------------------------------------------------- -->
    <section class="secao">
      <h2 class="cabecalho-secao">Texto</h2>

      <button type="button" id="ler" class="botao botao--principal" disabled>
        <span class="botao__rotulo">Ler a letra da foto</span>
        <span class="girador" aria-hidden="true"></span>
      </button>
      <p class="nota-rodape" id="statusLeitura"></p>

      <div class="grupo grupo--campo">
        <textarea id="texto" rows="12"
          placeholder="O texto lido aparece aqui &mdash; d&aacute; pra corrigir antes de salvar."></textarea>
      </div>
      <p class="nota-rodape">
        O texto &eacute; o dado principal, guardado separado da imagem.
        A letra &eacute; lida uma vez; o PDF pode ser gerado quantas vezes quiser.
      </p>
    </section>

    <!-- ETAPA 3 --------------------------------------------------------- -->
    <section class="secao">
      <h2 class="cabecalho-secao">Salvar</h2>
      <div class="grupo">
        <div class="linha linha--campo">
          <label for="titulo">T&iacute;tulo</label>
          <input type="text" id="titulo" placeholder="Derivadas &mdash; aula 3">
        </div>
        <div class="linha linha--campo">
          <label for="assunto">Assunto</label>
          <input type="text" id="assunto" list="assuntos" placeholder="C&aacute;lculo">
          <datalist id="assuntos"></datalist>
        </div>
      </div>
      <button type="button" id="salvar" class="botao botao--principal" disabled>Salvar nota</button>
    </section>

    <!-- ETAPA 4 --------------------------------------------------------- -->
    <section class="secao">
      <div class="cabecalho-secao cabecalho-secao--com-acao">
        <h2>Minhas notas</h2>
        <select id="filtro" class="seletor" aria-label="Filtrar por assunto">
          <option value="">Todos os assuntos</option>
        </select>
      </div>
      <ul id="lista" class="grupo lista"></ul>
    </section>

  </main>

  <!-- Feedback de conclusao: aparece, informa, some. Nao bloqueia nada. -->
  <div class="brindes" id="brindes" role="status" aria-live="polite"></div>

  <!-- Folha de acao: some pelo mesmo caminho por onde entrou, e da pra
       arrastar pra baixo pra dispensar. -->
  <div class="folha" id="folha" hidden>
    <div class="folha__veu" id="veu"></div>
    <div class="folha__painel" id="painel" role="dialog" aria-modal="true" aria-labelledby="folhaTitulo">
      <div class="folha__pegador" aria-hidden="true"></div>
      <h3 class="folha__titulo" id="folhaTitulo">Apagar esta nota?</h3>
      <p class="folha__texto" id="folhaTexto">N&atilde;o d&aacute; pra desfazer.</p>
      <button type="button" class="botao botao--destrutivo" id="folhaConfirmar">Apagar</button>
      <button type="button" class="botao botao--neutro" id="folhaCancelar">Cancelar</button>
    </div>
  </div>

  <script src="/app.js" type="module"></script>
</body>
</html>
