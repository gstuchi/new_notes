<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Entrar &mdash; Notas</title>
  <link rel="stylesheet" href="/estilo.css">
</head>
<body class="corpo-entrada">

  <!-- Tela de entrada do mockup. Nao ha .chrome aqui: nada rola por baixo,
       a tela cabe inteira. -->
  <main class="entrada">
    <div class="entrada__cartao" id="cartao">

      <header class="entrada__topo">
        <h1 class="titulo-grande">Notas</h1>
        <p class="entrada__apoio">Suas anota&ccedil;&otilde;es de caderno viram PDF.</p>
      </header>

      <form class="grupo" id="formEntrar" novalidate>
        <div class="linha linha--campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email"
                 inputmode="email" autocomplete="email" autocapitalize="off"
                 spellcheck="false" placeholder="voce@exemplo.com" required>
        </div>
        <div class="linha linha--campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha"
                 autocomplete="current-password" placeholder="sua senha" required>
        </div>
      </form>

      <p class="nota-rodape nota-rodape--erro" id="erro" role="alert" hidden></p>

      <button type="submit" form="formEntrar" class="botao botao--principal">Entrar</button>

      <p class="entrada__troca">
        Ainda n&atilde;o tem conta?
        <a href="/cadastro.html">Criar conta</a>
      </p>

      <p class="nota-rodape entrada__aviso">
        Demonstra&ccedil;&atilde;o: a conta fica guardada s&oacute; neste navegador.
        N&atilde;o use uma senha de verdade.
      </p>

    </div>
  </main>

  <script src="/entrada.js" type="module"></script>
</body>
</html>
